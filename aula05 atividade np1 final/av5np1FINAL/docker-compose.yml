version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: meu_banco
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data   # Volume persistente (obrigatório)

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"          # Porta do pgAdmin
    depends_on:
      - postgres
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin